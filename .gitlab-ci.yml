variables:
    GIT_DEPTH: "20"
before_script:
    - rm -rf ../Parser
    - git clone --depth 20 "http://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:8083/${CI_PROJECT_NAMESPACE}/Parser.git" ../Parser
build-test:
    stage: test
    image: mcr.microsoft.com/dotnet/sdk:9.0
    script: 
        - dotnet build LibraryCompiler.csproj -c Release -f net9.0 -p:TargetFrameworks=net9.0